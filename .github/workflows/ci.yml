name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate config exists
        run: |
          if [ -f "config.txt" ]; then
            echo "✓ config.txt found"
          else
            echo "✗ config.txt missing"
            exit 1
          fi

      - name: Validate workflow file exists
        run: |
          if [ -f ".github/workflows/ci.yml" ]; then
            echo "✓ ci.yml found"
          else
            echo "✗ ci.yml missing"
            exit 1
          fi

  test:
            name: Test
            runs-on: ubuntu-22.04
            needs: lint
        
            steps:
              - name: Checkout code
                uses: actions/checkout@v4
        
              - name: Run simulated tests
                run: |
                  echo "Running unit tests..."
                  sleep 1
                  echo "✓ Unit tests passed"
        
              - name: Generate test report
                run: |
                  mkdir -p test-output
                  echo "Test Report" > test-output/report.txt
                  echo "============" >> test-output/report.txt
                  echo "Run date:   $(date)" >> test-output/report.txt
                  echo "Commit:     ${{ github.sha }}" >> test-output/report.txt
                  echo "Branch:     ${{ github.ref }}" >> test-output/report.txt
                  echo "Result:     PASSED" >> test-output/report.txt
        
              - name: Upload test report
                uses: actions/upload-artifact@v4
                with:
                  name: test-report
                  path: test-output/
                  retention-days: 7
        
              - name: Set test result output
                id: test-result
                run: echo "result=passed" >> $GITHUB_OUTPUT
        
              - name: Print test result
                run: |
                  echo "Test result: ${{ steps.test-result.outputs.result }}"
        
  report:
            name: Read Test Report
            runs-on: ubuntu-22.04
            needs: test
        
            steps:
              - name: Download test report
                uses: actions/download-artifact@v4
                with:
                  name: test-report
                  path: downloaded-report/
        
              - name: Read and print report
                run: |
                  echo "Downloaded report contents:"
                  echo "==========================="
                  cat downloaded-report/report.txt

  compatibility-check:
    name: Check on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        config-file: ['config.txt']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check config on ${{ matrix.os }}
        run: |
          echo "Running on: ${{ matrix.os }}"
          echo "Checking: ${{ matrix.config-file }}"
          if [ -f "${{ matrix.config-file }}" ]; then
            echo "✓ ${{ matrix.config-file }} exists on ${{ matrix.os }}"
          else
            echo "✗ ${{ matrix.config-file }} missing on ${{ matrix.os }}"
            exit 1
          fi
  
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-22.04
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t project-alpha:${{ github.sha }} .
          echo "Built image: project-alpha:${{ github.sha }}"

      - name: Verify image was built
        run: |
          docker images project-alpha
          echo "Image size:"
          docker inspect project-alpha:${{ github.sha }} \
            --format='{{.Size}}' | \
            awk '{printf "%.1f MB\n", $1/1024/1024}'

      - name: Run the container as a smoke test
        run: |
          echo "Running container smoke test..."
          docker run --rm project-alpha:${{ github.sha }}

      - name: Save image digest
        run: |
          IMAGE_DIGEST=$(docker inspect \
            project-alpha:${{ github.sha }} \
            --format='{{.Id}}')
          echo "Image digest: $IMAGE_DIGEST"
          echo "digest=$IMAGE_DIGEST" >> $GITHUB_OUTPUT
        id: image-info 
  
  push-to-acr:
    name: Push to Azure Container Registry
    runs-on: ubuntu-22.04
    needs: docker-build
    if: false

    steps:
      - name: check Azure cli install
        run: |
            az --version

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | \
          docker login ${{ secrets.ACR_NAME }}.azurecr.io \
            -u ${{ secrets.ACR_USERNAME }} \
            --password-stdin

      - name: Build and tag for ACR
        run: |
          docker build \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/project-alpha:${{ github.sha }} \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/project-alpha:latest \
            .

      - name: Push to ACR
        run: |
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/project-alpha:${{ github.sha }}
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/project-alpha:latest
          echo "✓ Pushed to ACR successfully"
          echo "Image: ${{ secrets.ACR_NAME }}.azurecr.io/project-alpha:${{ github.sha }}"

      - name: Verify image in ACR
        run: |
          echo "Verifying image exists in ACR..."
          docker manifest inspect \
            ${{ secrets.ACR_NAME }}.azurecr.io/project-alpha:${{ github.sha }} \
            && echo "✓ Image verified in ACR" \
            || echo "✗ Image not found"

  summary:
    name: Pipeline Summary
    runs-on: ubuntu-22.04
    needs: [lint, test, compatibility-check,report, docker-build, push-to-acr]

    steps:
      - name: Print summary
        run: |
          echo "==============================="
          echo "Pipeline completed successfully"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref }}"
          echo "Actor:  ${{ github.actor }}"
          echo "==============================="

      - name: Notify on failure
        if: failure()
        run: |
          echo "Pipeline failed — would notify Slack here in a real pipeline"
  
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-22.04
    needs: summary
    environment: staging
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging
        env:
          APP_KEY: ${{ secrets.STAGING_APP_KEY }}
        run: |
          echo "Deploying to staging environment"
          echo "App key length: ${#APP_KEY}"
          echo "✓ Staging deployment complete"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-22.04
    needs: deploy-staging
    environment: production
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        env:
          APP_KEY: ${{ secrets.PROD_APP_KEY }}
        run: |
          echo "Deploying to production environment"
          echo "App key length: ${#APP_KEY}"
          echo "✓ Production deployment complete"        