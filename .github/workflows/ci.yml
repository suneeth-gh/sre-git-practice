name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate config exists
        run: |
          if [ -f "config.txt" ]; then
            echo "✓ config.txt found"
          else
            echo "✗ config.txt missing"
            exit 1
          fi

      - name: Validate workflow file exists
        run: |
          if [ -f ".github/workflows/ci.yml" ]; then
            echo "✓ ci.yml found"
          else
            echo "✗ ci.yml missing"
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-22.04
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run simulated tests
        run: |
          echo "Running unit tests..."
          sleep 1
          echo "✓ Unit tests passed"

      - name: Set test result output
        id: test-result
        run: echo "result=passed" >> $GITHUB_OUTPUT

      - name: Print test result
        run: |
          echo "Test result: ${{ steps.test-result.outputs.result }}"

  summary:
    name: Pipeline Summary
    runs-on: ubuntu-22.04
    needs: [lint, test]

    steps:
      - name: Print summary
        run: |
          echo "==============================="
          echo "Pipeline completed successfully"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref }}"
          echo "Actor:  ${{ github.actor }}"
          echo "==============================="

      - name: Notify on failure
        if: failure()
        run: |
          echo "Pipeline failed — would notify Slack here in a real pipeline"